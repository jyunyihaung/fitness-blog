<template data-exercise-template>
  <fieldset class="card exercise-editor" data-exercise>
    <legend>動作 <span data-exercise-number></span></legend>
    <div class="exercise-editor-header">
      <div class="form-grid exercise-fields">
        <label class="field"><span>動作名稱 *</span><input type="text" data-exercise-name list="exercise-suggestions" maxlength="120" autocomplete="off" placeholder="例如：Squat"></label>
        <label class="field">
          <span>分類</span>
          <select data-exercise-category>
            <option value="squat">深蹲</option><option value="bench">臥推</option><option value="deadlift">硬舉</option><option value="accessory" selected>輔助動作</option>
          </select>
        </label>
      </div>
      <button class="button danger-button" type="button" data-remove-exercise>刪除動作</button>
    </div>
    <div class="set-editor-list" data-sets></div>
    <button class="button compact-button" type="button" data-add-set>＋ 新增一組</button>
  </fieldset>
</template>

<datalist id="exercise-suggestions" data-exercise-suggestions></datalist>

<template data-set-template>
  <fieldset class="set-editor" data-set>
    <legend>第 <span data-set-number></span> 組</legend>
    <div class="set-fields">
      <label class="check-field completion-field" data-completion-field hidden><input type="checkbox" data-set-completed><span>完成</span></label>
      <label class="field"><span>重量 kg *</span><input type="number" data-set-weight min="0" step="0.5" inputmode="decimal" value="0"></label>
      <label class="field"><span>次數 *</span><input type="number" data-set-reps min="1" step="1" inputmode="numeric" value="1"></label>
      <label class="field"><span>RPE</span><input type="number" data-set-rpe min="1" max="10" step="0.5" inputmode="decimal"></label>
      <label class="field">
        <span>組別</span>
        <select data-set-type><option value="working" selected>工作組</option><option value="warmup">暖身組</option><option value="top">Top set</option><option value="backoff">Back-off</option><option value="amrap">AMRAP</option></select>
      </label>
      <label class="check-field"><input type="checkbox" data-set-warmup><span>暖身</span></label>
      <label class="field"><span>備註</span><textarea data-set-notes rows="2" maxlength="500"></textarea></label>
      <button class="button danger-button compact-button" type="button" data-remove-set>刪除</button>
    </div>
    <div class="inline-rest" data-inline-rest data-rest-state="idle">
      <div class="inline-rest-summary">
        <span>組間休息 <strong data-inline-rest-default>02:00</strong></span>
        <button class="button compact-button" type="button" data-inline-rest-start>開始</button>
      </div>
      <div class="inline-rest-active" data-inline-rest-active hidden>
        <strong class="inline-rest-clock" data-inline-rest-time>02:00</strong>
        <div class="inline-rest-actions">
          <button class="button compact-button" type="button" data-inline-rest-minus>-30 秒</button>
          <button class="button compact-button" type="button" data-inline-rest-pause>暫停</button>
          <button class="button compact-button" type="button" data-inline-rest-plus>+30 秒</button>
          <button class="button compact-button" type="button" data-inline-rest-reset>重設</button>
        </div>
        <span class="inline-rest-status" data-inline-rest-status role="status" aria-live="polite"></span>
      </div>
    </div>
  </fieldset>
</template>
