<section class="page-section record-page" aria-labelledby="record-title">
  <div class="section-header">
    <p class="eyebrow">Training record</p>
    <h1 id="record-title" tabindex="-1">新增訓練紀錄</h1>
    <p class="section-lede">記錄本次訓練、動作與每一組內容，資料會直接寫入已連接的 Google Sheet。</p>
  </div>

  <div class="empty-state" data-connection-message hidden></div>
  <form class="record-form" data-record-form novalidate>
    <fieldset class="card form-section">
      <legend>訓練資訊</legend>
      <div class="form-grid session-fields">
        <label class="field">
          <span>訓練日期 <span aria-hidden="true">*</span></span>
          <input type="date" name="training_date" required>
        </label>
        <label class="field">
          <span>訓練名稱 <span aria-hidden="true">*</span></span>
          <input type="text" name="title" required maxlength="120" autocomplete="off" placeholder="例如：深蹲訓練">
        </label>
        <label class="field">
          <span>訓練時間（分鐘）</span>
          <input type="number" name="duration_minutes" min="1" step="1" inputmode="numeric" value="5">
        </label>
      </div>
    </fieldset>

    <section class="form-section" aria-labelledby="exercises-title">
      <div class="form-section-header">
        <div>
          <p class="eyebrow">Exercises</p>
          <h2 id="exercises-title">訓練動作</h2>
        </div>
        <button class="button" type="button" data-add-exercise>＋ 新增動作</button>
      </div>
      <div class="exercise-editor-list" data-exercises></div>
    </section>
    <div class="validation-summary" data-validation-summary role="alert" hidden></div>
    <p class="save-status" data-save-status role="status" aria-live="polite"></p>
    <div class="form-actions">
      <button class="button primary" type="submit" data-save-record>儲存訓練紀錄</button>
      <a class="button button-link" href="#/dashboard">取消</a>
    </div>
  </form>
</section>
