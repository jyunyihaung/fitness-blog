title: Fitness Blog
description: A Google Sheets-powered fitness tracker running on GitHub Pages.
brand_initials: FB
url: "https://jyunyihaung.github.io"
baseurl: "/fitness-blog"
lang: en
timezone: UTC

# Share the spreadsheet as "Anyone with the link can view". It must contain
# Sessions and Sets sheets matching DATA_MODEL.md.
google_sheets:
  spreadsheet_id: ""

markdown: kramdown

navigation:
  - label: Dashboard
    url: /
  - label: Workouts
    url: /#workouts
  - label: Charts
    url: /#charts
  - label: Statistics
    url: /#statistics
  - label: Foundation
    url: /#foundation-title

exclude:
  - AGENTS.md
  - ARCHITECTURE.md
  - DATA_MODEL.md
  - ROADMAP.md
  - UI_GUIDELINES.md
  - Gemfile
  - Gemfile.lock
  - README.md
