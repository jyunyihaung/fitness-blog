<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description | escape }}">
    <title>
      {%- if page.title -%}
        {{ page.title | escape }} | {{ site.title | escape }}
      {%- else -%}
        {{ site.title | escape }}
      {%- endif -%}
    </title>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include navbar.html %}
    <main id="main-content" class="site-main">
      {{ content }}
    </main>
    {% include footer.html %}
    <script>
      window.FitnessConfig = {
        googleSheets: {
          spreadsheetId: {{ site.google_sheets.spreadsheet_id | jsonify }},
          oauthClientId: {{ site.google_sheets.oauth_client_id | jsonify }},
          pickerApiKey: {{ site.google_sheets.picker_api_key | jsonify }},
          pickerAppId: {{ site.google_sheets.picker_app_id | jsonify }}
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="{{ '/assets/js/main.js' | relative_url }}"></script>
  </body>
</html>
